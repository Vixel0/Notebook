<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook - تطبيق الملاحظات والمهام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header with Theme Toggle -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">📓 Notebook</h1>
                <button class="theme-toggle" id="themeToggle" title="تبديل الوضع">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="notes">📝 الملاحظات</button>
            <button class="tab-btn" data-tab="tasks">✅ المهام اليومية</button>
            <button class="tab-btn" data-tab="habits">🎯 العادات</button>
            <button class="tab-btn" data-tab="pomodoro">⏲️ Pomodoro</button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- NOTES TAB -->
            <section id="notes" class="tab-content active">
                <div class="section-header">
                    <h2>📝 الملاحظات الخاصة بك</h2>
                </div>

                <div class="notes-controls">
                    <input type="text" id="noteTitle" placeholder="عنوان الملاحظة..." class="input-field">
                    
                    <div class="controls-row">
                        <select id="fontFamily" class="select-field">
                            <option value="Arial">Arial</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Comic Sans MS">Comic Sans MS</option>
                            <option value="Trebuchet MS">Trebuchet MS</option>
                        </select>

                        <input type="number" id="fontSize" min="12" max="32" value="16" class="input-number">
                        <span class="label">حجم الخط</span>

                        <input type="color" id="fontColor" value="#000000" class="color-picker">
                        <span class="label">لون الخط</span>
                    </div>

                    <div class="controls-row">
                        <select id="bgColor" class="select-field">
                            <option value="bg-light-blue">أزرق فاتح</option>
                            <option value="bg-mint">أخضر فاتح</option>
                            <option value="bg-peach">وردي فاتح</option>
                            <option value="bg-yellow">أصفر فاتح</option>
                            <option value="bg-lavender">بنفسجي فاتح</option>
                            <option value="bg-coral">مرجاني</option>
                            <option value="bg-gradient-1">تدرج أزرق برتقالي</option>
                            <option value="bg-gradient-2">تدرج أخضر وردي</option>
                            <option value="bg-gradient-3">تدرج بنفسجي أحمر</option>
                        </select>
                        <span class="label">خلفية الملاحظة</span>
                    </div>
                </div>

                <textarea id="noteContent" placeholder="اكتب ملاحظتك هنا..." class="textarea-field"></textarea>

                <div class="button-group">
                    <button id="saveNote" class="btn btn-primary">💾 حفظ الملاحظة</button>
                    <button id="clearNote" class="btn btn-secondary">🗑️ مسح</button>
                </div>

                <div id="notesList" class="notes-list">
                    <!-- Notes will be displayed here -->
                </div>
            </section>

            <!-- TASKS TAB -->
            <section id="tasks" class="tab-content">
                <div class="section-header">
                    <h2>✅ المهام اليومية</h2>
                </div>

                <div class="tasks-controls">
                    <input type="text" id="taskInput" placeholder="أضف مهمة جديدة..." class="input-field">
                    <button id="addTask" class="btn btn-primary">➕ إضافة</button>
                </div>

                <div class="tasks-list" id="tasksList">
                    <!-- Tasks will be displayed here -->
                </div>

                <div class="stats">
                    <p>المهام المنجزة: <span id="completedCount">0</span> من <span id="totalCount">0</span></p>
                </div>
            </section>

            <!-- HABITS TAB -->
            <section id="habits" class="tab-content">
                <div class="section-header">
                    <h2>🎯 تنظيم العادات</h2>
                </div>

                <div class="habits-controls">
                    <input type="text" id="habitInput" placeholder="أضف عادة جديدة..." class="input-field">
                    <button id="addHabit" class="btn btn-primary">➕ إضافة</button>
                </div>

                <div class="habits-list" id="habitsList">
                    <!-- Habits will be displayed here -->
                </div>
            </section>

            <!-- POMODORO TAB -->
            <section id="pomodoro" class="tab-content">
                <div class="section-header">
                    <h2>⏲️ مؤقت Pomodoro</h2>
                </div>

                <div class="pomodoro-container">
                    <div class="pomodoro-display">
                        <div class="timer-circle">
                            <span id="timerDisplay">25:00</span>
                        </div>
                    </div>

                    <div class="pomodoro-controls">
                        <button id="startTimer" class="btn btn-primary">▶️ ابدأ</button>
                        <button id="pauseTimer" class="btn btn-secondary" disabled>⏸️ إيقاف مؤقت</button>
                        <button id="resetTimer" class="btn btn-secondary">🔄 إعادة تعيين</button>
                    </div>

                    <div class="pomodoro-settings">
                        <div class="setting">
                            <label>مدة العمل (دقائق):</label>
                            <input type="number" id="workDuration" min="1" max="60" value="25" class="input-number">
                        </div>
                        <div class="setting">
                            <label>مدة الراحة (دقائق):</label>
                            <input type="number" id="breakDuration" min="1" max="30" value="5" class="input-number">
                        </div>
                    </div>

                    <div class="pomodoro-info">
                        <p id="sessionType">جلسة عمل</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
